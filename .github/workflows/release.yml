---
name: Release

# Builds the distributable ZIP for a published GitHub release, a merged automated
# release-preparation PR, or a manual test build. Automated publication is
# triggered by the .editor-version change landing on main, so unrelated pull
# requests do not create skipped Release workflow runs. Release metadata is
# always committed before the plugin tag exists and version.php ships
# byte-identical to the reviewed release commit. After an automated release is
# published, the same workflow advances main to the next real Moodle version and
# switches $plugin->release back to dev; the published tag remains immutable.

on:
  push:
    branches:
      - main
    paths:
      - .editor-version
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      editor_repo_url:
        description: "Editor source repository URL"
        required: false
        default: "https://github.com/exelearning/exelearning.git"
      editor_ref:
        description: "Editor ref value (main, branch name, or tag)"
        required: false
        default: "main"
      editor_ref_type:
        description: "Type of editor ref"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - branch
          - tag

permissions:
  contents: write

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Set environment variables
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW_TAG="${GITHUB_REF##*/}"
            VERSION_TAG="${RAW_TAG#v}"
            echo "PUBLISH_RELEASE=true" >> "$GITHUB_ENV"
            echo "CREATE_PLUGIN_TAG=false" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=${VERSION_TAG}" >> "$GITHUB_ENV"
            echo "EXELEARNING_EDITOR_REPO_URL=https://github.com/exelearning/exelearning.git" >> "$GITHUB_ENV"
            echo "EXELEARNING_EDITOR_REF=v${VERSION_TAG}" >> "$GITHUB_ENV"
            echo "EXELEARNING_EDITOR_REF_TYPE=tag" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ]; then
            RAW_TAG=$(tr -d '[:space:]' < .editor-version)
            VERSION_TAG="${RAW_TAG#v}"
            echo "PUBLISH_RELEASE=true" >> "$GITHUB_ENV"
            echo "CREATE_PLUGIN_TAG=true" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=${VERSION_TAG}" >> "$GITHUB_ENV"
            echo "EXELEARNING_EDITOR_REPO_URL=https://github.com/exelearning/exelearning.git" >> "$GITHUB_ENV"
            echo "EXELEARNING_EDITOR_REF=v${VERSION_TAG}" >> "$GITHUB_ENV"
            echo "EXELEARNING_EDITOR_REF_TYPE=tag" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_RELEASE=false" >> "$GITHUB_ENV"
            echo "CREATE_PLUGIN_TAG=false" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=dev" >> "$GITHUB_ENV"
            echo "EXELEARNING_EDITOR_REPO_URL=${{ github.event.inputs.editor_repo_url }}" >> "$GITHUB_ENV"
            echo "EXELEARNING_EDITOR_REF=${{ github.event.inputs.editor_ref }}" >> "$GITHUB_ENV"
            echo "EXELEARNING_EDITOR_REF_TYPE=${{ github.event.inputs.editor_ref_type }}" >> "$GITHUB_ENV"
          fi

      - name: Validate release metadata
        run: |
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            bash scripts/check-version.sh --release "$RELEASE_TAG"
          else
            bash scripts/check-version.sh
          fi

      - name: Create plugin tag for merged preparation PR
        if: env.CREATE_PLUGIN_TAG == 'true'
        run: |
          TAG="v${RELEASE_TAG}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            TAGGED_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$TAGGED_SHA" != "$HEAD_SHA" ]; then
              echo "Tag $TAG already points to $TAGGED_SHA, not merged commit $HEAD_SHA" >&2
              exit 1
            fi
            echo "Tag $TAG already points to the merged commit."
          else
            git tag "$TAG" "$HEAD_SHA"
            git push origin "$TAG"
          fi

      - name: Verify tagged commit
        if: env.PUBLISH_RELEASE == 'true'
        run: |
          TAG="v${RELEASE_TAG}"
          TAGGED_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$TAGGED_SHA" != "$HEAD_SHA" ]; then
            echo "Checked-out commit $HEAD_SHA is not the tagged commit $TAGGED_SHA" >&2
            exit 1
          fi
          bash scripts/check-version.sh --release "$RELEASE_TAG"

      - name: Build static editor
        run: make build-editor

      - name: Create package
        run: make package RELEASE=${RELEASE_TAG}

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod_exelearning-${{ env.RELEASE_TAG }}
          path: mod_exelearning-${{ env.RELEASE_TAG }}.zip

      - name: Create or update GitHub release
        if: env.PUBLISH_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_TAG }}
          name: v${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: mod_exelearning-${{ env.RELEASE_TAG }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Return main to development
        if: github.event_name == 'push' && env.PUBLISH_RELEASE == 'true'
        run: |
          set -euo pipefail

          RELEASE_COMMIT=$(git rev-parse "v${RELEASE_TAG}^{commit}")
          git fetch origin main
          git checkout -B post-release-dev origin/main

          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD; then
            echo "Release commit $RELEASE_COMMIT is not an ancestor of current main; refusing to update version.php." >&2
            exit 1
          fi

          CURRENT_VERSION=$(sed -n "s/^\$plugin->version[[:space:]]*=[[:space:]]*\([0-9][0-9]*\);.*/\1/p" version.php | head -n1)
          CURRENT_PREFIX=${CURRENT_VERSION%??}
          CURRENT_SEQUENCE=${CURRENT_VERSION#????????}
          TODAY_PREFIX=$(date -u +%Y%m%d)

          if [ "$TODAY_PREFIX" -gt "$CURRENT_PREFIX" ]; then
            NEXT_VERSION="${TODAY_PREFIX}00"
          else
            NEXT_SEQUENCE=$((10#$CURRENT_SEQUENCE + 1))
            if [ "$NEXT_SEQUENCE" -gt 99 ]; then
              echo "Cannot allocate another Moodle version for date prefix $CURRENT_PREFIX" >&2
              exit 1
            fi
            NEXT_VERSION=$(printf '%s%02d' "$CURRENT_PREFIX" "$NEXT_SEQUENCE")
          fi

          sed -i -E \
            -e "s/^\$plugin->version[[:space:]]*=.*/\$plugin->version   = $NEXT_VERSION;/" \
            -e "s/^\$plugin->release[[:space:]]*=.*/\$plugin->release   = 'dev';/" \
            version.php

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.php
          git commit -m "Start development after v${RELEASE_TAG}"

          bash scripts/check-version.sh
          git push origin HEAD:main
