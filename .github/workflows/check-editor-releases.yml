---
name: Check Editor Releases

# Watches exelearning/exelearning for a new editor release and opens one release
# preparation pull request. The PR pins the editor and commits the final Moodle
# version metadata. Merging that reviewed PR lets release.yml tag the exact merge
# commit, build the reproducible ZIP and publish the GitHub release.

on:
  schedule:
    - cron: "0 8 * * *" # Daily at 8:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get latest exelearning release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/exelearning/exelearning/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "No release found"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Latest editor release: $LATEST"
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"

          CURRENT=""
          if [ -f .editor-version ]; then
            CURRENT=$(cat .editor-version)
          fi
          echo "Current pinned version: $CURRENT"

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Already up to date"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version available"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open release preparation pull request
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ steps.check.outputs.tag }}"
          RELEASE="${TAG#v}"
          BRANCH="release/editor-${TAG}"

          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "A release preparation PR for $TAG is already open; nothing to do."
            exit 0
          fi

          CURRENT_VERSION=$(sed -n "s/^\$plugin->version[[:space:]]*=[[:space:]]*\([0-9][0-9]*\);.*/\1/p" version.php | head -n1)
          TODAY_PREFIX=$(date -u +%Y%m%d)
          CURRENT_PREFIX=${CURRENT_VERSION%??}
          CURRENT_SEQUENCE=${CURRENT_VERSION#????????}

          if [ "$TODAY_PREFIX" -gt "$CURRENT_PREFIX" ]; then
            NEXT_VERSION="${TODAY_PREFIX}00"
          else
            NEXT_SEQUENCE=$((10#$CURRENT_SEQUENCE + 1))
            if [ "$NEXT_SEQUENCE" -gt 99 ]; then
              echo "Cannot allocate another Moodle version for date prefix $CURRENT_PREFIX" >&2
              exit 1
            fi
            NEXT_VERSION=$(printf '%s%02d' "$CURRENT_PREFIX" "$NEXT_SEQUENCE")
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          echo "$TAG" > .editor-version
          sed -i -E \
            -e "s#(release=)v[0-9][0-9A-Za-z.-]*#\1$TAG#g" \
            -e "s#(releases/download/)v[0-9][0-9A-Za-z.-]*#\1$TAG#g" \
            -e "s#(exelearning-static-)v[0-9][0-9A-Za-z.-]*(\.zip)#\1$TAG\2#g" \
            blueprint.json
          sed -i -E \
            -e "s/^\$plugin->version[[:space:]]*=.*/\$plugin->version   = $NEXT_VERSION;/" \
            -e "s/^\$plugin->release[[:space:]]*=.*/\$plugin->release   = '$RELEASE';/" \
            version.php

          bash scripts/check-version.sh --release "$RELEASE"

          git add .editor-version blueprint.json version.php
          git commit -m "Prepare plugin release $TAG"
          git push --force origin "$BRANCH"

          BODY=$(cat <<EOF
          ## Summary

          - Pin the embedded editor and Moodle Playground preview to [$TAG](https://github.com/exelearning/exelearning/releases/tag/$TAG).
          - Set \`\$plugin->version\` to \`$NEXT_VERSION\`.
          - Set \`\$plugin->release\` to \`$RELEASE\`.

          ## Release flow

          Merging this pull request publishes the plugin release automatically. The release workflow tags the exact merged commit as \`$TAG\`, builds the editor from the matching editor tag, creates the reproducible ZIP and uploads it to the GitHub release.

          The workflow deliberately waits for review and merge: it never publishes directly from the scheduled watcher branch.
          EOF
          )

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Prepare plugin release $TAG" \
            --body "$BODY"
