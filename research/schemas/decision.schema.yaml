$schema: "https://json-schema.org/draft/2020-12/schema"
title: ADR (frontmatter de DEC-<numero-de-seguimiento>-<NN>-<slug>.md)
type: object
required: [id, titulo, estado, fecha]
$defs:
  # Identificador actual (`DEC-13-01`) o retirado (`DEC-0-01`). La numeración
  # retirada sólo sigue viva en los 18 registros del arranque del repositorio,
  # enumerados en tools/check_decisions.py; el contenido nuevo usa la actual.
  decisionId:
    type: string
    pattern: "^DEC-([1-9][0-9]*-[0-9]{2}|[0-9]{4})$"
properties:
  id: { $ref: "#/$defs/decisionId" }
  titulo: { type: string }
  estado:
    enum: [Propuesta, Aceptada, Rechazada, Superseded]
  fecha: { type: string, format: date }
  # Número de GitHub que identifica la decisión: el issue del cambio, o su pull
  # request cuando no hay issue. Coincide con el prefijo del nombre de archivo.
  tracking_issue: { type: integer, minimum: 1 }
  legacy_id: { type: string, pattern: "^DEC-[0-9]{4}$" }
  agentes:
    type: array
    items: { type: string }
  fuentes:
    type: array
    items: { type: string }
  experimentos:
    type: array
    items: { type: string }
  relacionados:
    type: array
    items: { $ref: "#/$defs/decisionId" }
  supersede: { $ref: "#/$defs/decisionId" }
  reemplazada_por: { $ref: "#/$defs/decisionId" }
  herramienta_ia:
    type: object
    properties:
      interfaz: { type: string }
      modelo: { type: string }
additionalProperties: true
