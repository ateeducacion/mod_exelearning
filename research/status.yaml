      - AN-008
      - DEC-0-03
      - DEC-0-16
    notas: >-
      Investigación completada el 2026-06-02 (DEC-0-16). Comparado con core: mod_scorm
      embebe HTML no confiable SIN sandbox (más débil); core_h5p tampoco usa sandbox pero
      su contenido son librerías curadas por el admin (otro modelo de amenaza). mod_exelearning
      ya es el mejor aislado de los tres (sandbox parcial). Hechos verificados: core NO ofrece
      origen separado ($CFG->wwwroot único; url.php hardcodea), el bridge SCORM es 100%
      same-origin (3 dependencias: contentDocument objectid DEC-5-01, window.parent.API,
      teacher-mode hider) y CSP/Permissions-Policy SÍ se pueden emitir desde exelearning_pluginfile.
      Decisión (erseco): documentar pros/contras + roadmap, NO implementar ahora. Roadmap en
      DEC-0-16: Tier 1 (M2 Permissions-Policy + M3 CSP estricto-con-toggle + M1) → Tier 2
      (M6 postMessage bridge → M7 origen opaco/subdominio).
