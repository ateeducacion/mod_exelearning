      Cierra el hueco de "completion rules" frente a mod_exescorm: exelearning pasa a
      FEATURE_COMPLETION_HAS_RULES=true con UNA sola regla a nivel de módulo,
      completionstatusrequired (aprobado / completado / cualquiera), reutilizando el campo
      status ya persistido en exelearning_attempt. Contrato Moodle completo: columna INT(1)
      nullable + upgrade stage 17 (2026061202), exelearning_get_coursemodule_info,
      add_completion_rules/completion_rule_enabled/data_postprocessing en mod_form, subclase
      classes/completion/custom_completion.php (get_state). Descartado completionscorerequired
      (solapa con completion-by-grade DEC-25-01/DEC-0-10) y completionstatusallscos (multi-SCO
      ajeno a eXe). No conflictúa con DEC-67-01 (que rechazó completion per-iDevice): esta regla
      es un estado por módulo. Backup conserva el campo. Riesgos RIE-014/RIE-015.
  DEC-72-01:
    titulo: "Auditoría follow-up post-refactor (#71): 8 mejoras + 1 descartado por decisión previa"
    estado: Aceptada
    ruta: decisiones/adr/DEC-72-01-auditoria-followup-post-refactor.md
    fecha: 2026-06-12
    relacionados: [DEC-71-01, DEC-4-01, DEC-0-16, DEC-6-01, DEC-13-12]
    notas: >-
      Seguimiento de la auditoría tras fusionar DEC-68-01, DEC-69-01, DEC-70-01 y DEC-71-01. 8 mejoras: validar entrada .elpx en
      migración exescorm (zip_utils), guard central de extracción servible (package_manager lanza
      migrateextractfailed, RIE-019), lock atómico core\lock en el instalador del editor, quitar
      Service-Worker-Allowed:/, helper editor_paths::is_within compartido, refs de docs post-refactor
      (~27), privacidad.md a estado real, docblock is_import_blocked. DESCARTADO #2 (track sin lock):
      contradice DEC-6-01/RIE-011 (degradado deliberado, paridad con core). Minor: licencias.md y
      composer lint --ignore.
  DEC-77-01:
    titulo: "Extracción de paquete no-destructiva: validar la nueva revisión antes de podar la anterior (issue 73)"
    estado: Aceptada
    ruta: decisiones/adr/DEC-77-01-extraccion-no-destructiva.md
    fecha: 2026-06-13
    relacionados: [DEC-71-01, DEC-34-01, DEC-13-08, DEC-72-01]
    notas: >-
      Patrón stage->validate->swap: extract_stored borra solo content/{revision} y hace rollback de su
      propia revisión parcial; save_and_extract estaciona el package en itemid=revision; nuevo
      store_and_activate_revision (editor) y prune_content/package_revisions; update_instance reordena
      extraer-validar->commit->podar. Un reemplazo corrupto preserva el último contenido válido en TODAS
      las vías (el editor pasa de irrecuperable a recuperable). Resuelve RIE-019. Promueve maturity
      BETA->STABLE (consecuencia, no decisión aparte; version sentinel intacto, DEC-13-08). 263 tests
      verdes (make test). Tests nuevos: 6 en package_manager_extract_test, 2 en lib_test.
