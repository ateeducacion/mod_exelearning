      - DEC-0-16
      - AN-008
    notas: >-
      Investigar técnicas de sandboxing de JS en el cliente como alternativa/complemento al
      aislamiento por origen (M7), manteniendo el servido same-origin: ShadowRealm (TC39),
      SES/hardened-JS + Compartments (Agoric), Web Worker + proxy de DOM (modelo WorkerDOM de
      AMP), intérprete JS en WASM (QuickJS estilo plugins de Figma) y librerías tipo sandboxjs
      (Proxy sobre globalThis). Evaluar viabilidad real con el motor eXeLearning v4 (asume DOM
      real + jQuery + pipwerks → un realm/worker sin DOM probablemente no lo ejecuta sin un shim
      costoso) y coste/beneficio frente a M6+M7. Documentado como M8 en DEC-0-16.
  TAREA-014:
